name: ci_ios_test
description: >-
  The iOS integration test app: depends only on camerawesome, so it builds
  with Swift Package Manager and no CocoaPods (the example pulls in ML Kit,
  which ships no arm64 simulator slice).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  camerawesome:
    path: ../
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
